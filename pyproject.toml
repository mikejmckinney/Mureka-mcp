[project]
name = "mureka-mcp"
version = "0.0.13"
description = "The mcp server of Mureka.ai"
authors = [
    { name = "wei.zhang", email = "zhangwei@singularity-ai.com" }
]
readme = "README.md"
classifiers = []
keywords = [
    "mureka",
    "mcp",
    "music",
    "song",
    "instrumental",
    "aigc",
    "ai",
    "generate"
]
requires-python = ">=3.10"
dependencies = [
    "httpx==0.28.1",
    "mcp[cli]==1.28.1",
    "sounddevice==0.5.1",
    "soundfile==0.13.1",
    "requests==2.33.0"
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0"
]

[project.scripts]
mureka-mcp = "mureka_mcp.api:main"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
